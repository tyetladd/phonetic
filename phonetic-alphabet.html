<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonetic Alphabet Learning</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            min-width: 400px;
        }
        h1 { color: #333; margin-bottom: 40px; font-size: 28px; }
        .language-switch {
            display: inline-flex;
            gap: 4px;
            padding: 4px;
            background: #f0eef6;
            border-radius: 10px;
        }
        .language-btn {
            padding: 10px 18px;
            background: transparent;
            color: #555;
            font-size: 14px;
            border-radius: 7px;
        }
        .language-btn.active { background: white; color: #333; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15); }
        .letter-display {
            font-size: 120px;
            font-weight: bold;
            color: #667eea;
            margin: 30px 0;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .word-display {
            font-size: 36px;
            color: #764ba2;
            margin: 30px 0;
            min-height: 50px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .word-display.visible { opacity: 1; }
        .buttons { display: flex; gap: 15px; justify-content: center; margin-top: 40px; }
        button {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        .check-btn { background-color: #667eea; color: white; }
        .check-btn:hover {
            background-color: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .next-btn { background-color: #764ba2; color: white; }
        .next-btn:hover {
            background-color: #63408a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }
        button:active { transform: translateY(0); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Phonetic Alphabet Learning</h1>
        <div class="language-switch" role="group" aria-label="Card language">
            <button class="language-btn active" type="button" data-mode="EN" aria-pressed="true">EN</button>
            <button class="language-btn" type="button" data-mode="RU" aria-pressed="false">RU</button>
            <button class="language-btn" type="button" data-mode="MIX" aria-pressed="false">MIX</button>
        </div>
        <div class="letter-display" id="letterDisplay"></div>
        <div class="word-display" id="wordDisplay"></div>
        <div class="buttons">
            <button class="check-btn" id="checkBtn">Check</button>
            <button class="next-btn" id="nextBtn">Next</button>
        </div>
    </div>
    <script>
        const phoneticAlphabets = {
            EN: {
            'A': 'Alpha', 'B': 'Bravo', 'C': 'Charlie', 'D': 'Delta',
            'E': 'Echo', 'F': 'Foxtrot', 'G': 'Golf', 'H': 'Hotel',
            'I': 'India', 'J': 'Juliet', 'K': 'Kilo', 'L': 'Lima',
            'M': 'Mike', 'N': 'November', 'O': 'Oscar', 'P': 'Papa',
            'Q': 'Quebec', 'R': 'Romeo', 'S': 'Sierra', 'T': 'Tango',
            'U': 'Uniform', 'V': 'Victor', 'W': 'Whiskey', 'X': 'X-ray',
            'Y': 'Yankee', 'Z': 'Zulu'
                        },
                        RU: {
            'А': 'Анна', 'Б': 'Борис', 'В': 'Василий', 'Г': 'Григорий',
            'Д': 'Дмитрий', 'Е': 'Елена', 'Ё': 'Ёлка', 'Ж': 'Женя',
            'З': 'Зинаида', 'И': 'Иван', 'Й': 'И краткое', 'К': 'Константин',
            'Л': 'Леонид', 'М': 'Михаил', 'Н': 'Николай', 'О': 'Ольга',
            'П': 'Павел', 'Р': 'Роман', 'С': 'Семён', 'Т': 'Татьяна',
            'У': 'Ульяна', 'Ф': 'Фёдор', 'Х': 'Харитон', 'Ц': 'Цапля',
            'Ч': 'Человек', 'Ш': 'Шура', 'Щ': 'Щука', 'Ъ': 'Твёрдый знак',
            'Ы': 'Еры', 'Ь': 'Мягкий знак', 'Э': 'Эхо', 'Ю': 'Юрий',
            'Я': 'Яков'
                        }
        };
        let currentMode = 'EN';
        let currentCard = null;
        let isAnswerVisible = false;
        const letterDisplay = document.getElementById('letterDisplay');
        const wordDisplay = document.getElementById('wordDisplay');
        const checkBtn = document.getElementById('checkBtn');
        const nextBtn = document.getElementById('nextBtn');
        const languageButtons = document.querySelectorAll('.language-btn');
        function getCards() {
            const languages = currentMode === 'MIX' ? ['EN', 'RU'] : [currentMode];
            return languages.flatMap(language => Object.entries(phoneticAlphabets[language]).map(([letter, word]) => ({ letter, word })));
        }
        function showNewLetter() {
            const cards = getCards();
            currentCard = cards[Math.floor(Math.random() * cards.length)];
            letterDisplay.textContent = currentCard.letter;
            wordDisplay.textContent = '';
            wordDisplay.classList.remove('visible');
            isAnswerVisible = false;
        }
        function showAnswer() {
            wordDisplay.textContent = currentCard.word;
            wordDisplay.classList.add('visible');
            isAnswerVisible = true;
        }
        languageButtons.forEach(button => {
            button.addEventListener('click', () => {
                currentMode = button.dataset.mode;
                languageButtons.forEach(languageButton => {
                    const isActive = languageButton === button;
                    languageButton.classList.toggle('active', isActive);
                    languageButton.setAttribute('aria-pressed', String(isActive));
                });
                showNewLetter();
            });
        });
        checkBtn.addEventListener('click', () => {
            if (!isAnswerVisible) showAnswer();
        });
        nextBtn.addEventListener('click', () => {
            showNewLetter();
        });

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!isAnswerVisible) showAnswer();
            } else if (e.code === 'ArrowRight') {
                e.preventDefault();
                showNewLetter();
            } else if (e.code === 'ArrowLeft') {
                e.preventDefault();
                showNewLetter();
            }
        });

        showNewLetter();
    </script>
</body>
</html>
