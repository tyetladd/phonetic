<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonetic Alphabet Learning</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            min-width: 400px;
        }
        h1 { color: #333; margin-bottom: 40px; font-size: 28px; }
        .lang-badge {
            display: inline-block;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: white;
            background-color: #667eea;
        }
        .lang-badge.ru { background-color: #764ba2; }
        .letter-display {
            font-size: 120px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0 30px;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .letter-display.ru { color: #764ba2; }
        .word-display {
            font-size: 36px;
            color: #333;
            margin: 30px 0;
            min-height: 50px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .word-display.visible { opacity: 1; }
        .buttons { display: flex; gap: 15px; justify-content: center; margin-top: 40px; }
        button {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        .check-btn { background-color: #667eea; color: white; }
        .check-btn:hover {
            background-color: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .next-btn { background-color: #764ba2; color: white; }
        .next-btn:hover {
            background-color: #63408a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }
        button:active { transform: translateY(0); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Phonetic Alphabet Learning</h1>
        <div><span class="lang-badge" id="langBadge"></span></div>
        <div class="letter-display" id="letterDisplay"></div>
        <div class="word-display" id="wordDisplay"></div>
        <div class="buttons">
            <button class="check-btn" id="checkBtn">Check</button>
            <button class="next-btn" id="nextBtn">Next</button>
        </div>
    </div>
    <script>
        // NATO/ICAO spelling alphabet
        const englishAlphabet = {
            'A': 'Alpha', 'B': 'Bravo', 'C': 'Charlie', 'D': 'Delta',
            'E': 'Echo', 'F': 'Foxtrot', 'G': 'Golf', 'H': 'Hotel',
            'I': 'India', 'J': 'Juliet', 'K': 'Kilo', 'L': 'Lima',
            'M': 'Mike', 'N': 'November', 'O': 'Oscar', 'P': 'Papa',
            'Q': 'Quebec', 'R': 'Romeo', 'S': 'Sierra', 'T': 'Tango',
            'U': 'Uniform', 'V': 'Victor', 'W': 'Whiskey', 'X': 'X-ray',
            'Y': 'Yankee', 'Z': 'Zulu'
        };

        // Russian radio alphabet
        const russianAlphabet = {
            'А': 'Анна', 'Б': 'Борис', 'В': 'Василий', 'Г': 'Григорий',
            'Д': 'Дмитрий', 'Е': 'Елена', 'Ж': 'Женя', 'З': 'Зинаида',
            'И': 'Иван', 'Й': 'Иван краткий', 'К': 'Константин', 'Л': 'Леонид',
            'М': 'Михаил', 'Н': 'Николай', 'О': 'Ольга', 'П': 'Павел',
            'Р': 'Роман', 'С': 'Семён', 'Т': 'Татьяна', 'У': 'Ульяна',
            'Ф': 'Фёдор', 'Х': 'Харитон', 'Ц': 'Цапля', 'Ч': 'Человек',
            'Ш': 'Шура', 'Щ': 'Щука', 'Ъ': 'Твёрдый знак', 'Ы': 'Еры',
            'Ь': 'Мягкий знак', 'Э': 'Эхо', 'Ю': 'Юрий', 'Я': 'Яков'
        };

        // Both alphabets share one shuffled deck, so cards alternate languages at random.
        const deck = [
            ...Object.entries(englishAlphabet).map(([letter, word]) => ({ letter, word, lang: 'en' })),
            ...Object.entries(russianAlphabet).map(([letter, word]) => ({ letter, word, lang: 'ru' }))
        ];
        const langLabels = { en: 'English', ru: 'Русский' };

        let currentCard = null;
        let isAnswerVisible = false;
        const langBadge = document.getElementById('langBadge');
        const letterDisplay = document.getElementById('letterDisplay');
        const wordDisplay = document.getElementById('wordDisplay');
        const checkBtn = document.getElementById('checkBtn');
        const nextBtn = document.getElementById('nextBtn');
        function getRandomCard() {
            let card;
            // Avoid showing the same card twice in a row.
            do {
                card = deck[Math.floor(Math.random() * deck.length)];
            } while (currentCard && card === currentCard);
            return card;
        }
        function showNewLetter() {
            currentCard = getRandomCard();
            langBadge.textContent = langLabels[currentCard.lang];
            langBadge.classList.toggle('ru', currentCard.lang === 'ru');
            letterDisplay.textContent = currentCard.letter;
            letterDisplay.classList.toggle('ru', currentCard.lang === 'ru');
            wordDisplay.textContent = '';
            wordDisplay.classList.remove('visible');
            isAnswerVisible = false;
        }
        function showAnswer() {
            wordDisplay.textContent = currentCard.word;
            wordDisplay.classList.add('visible');
            isAnswerVisible = true;
        }
        checkBtn.addEventListener('click', () => {
            if (!isAnswerVisible) showAnswer();
        });
        nextBtn.addEventListener('click', () => {
            showNewLetter();
        });

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!isAnswerVisible) showAnswer();
            } else if (e.code === 'ArrowRight') {
                e.preventDefault();
                showNewLetter();
            } else if (e.code === 'ArrowLeft') {
                e.preventDefault();
                showNewLetter();
            }
        });

        showNewLetter();
    </script>
</body>
</html>
